services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/social_automation
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      PUBLIC_API_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:4000
    ports:
      - "4000:4000"
    volumes:
      - media_data:/app/backend/storage

volumes:
  mongo_data:
  media_data:
